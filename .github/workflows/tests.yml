name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,packaging]"
      - name: Validate packaging sources
        run: |
          python -m py_compile packaging/entrypoint.py packaging/build_manifest.py packaging/analyze_distribution.py packaging/diff_distributions.py packaging/analyze_pe_dependencies.py packaging/build_torch_binary_inventory.py packaging/optimization_profile.py packaging/cpu_build_provenance.py packaging/cpu_package_policy.py packaging/model_bundle.py packaging/validate_cpu_distribution.py packaging/installer/release_metadata.py packaging/clean_machine/generate_sandbox_config.py packaging/clean_machine/prepare_assets.py packaging/hooks/hook-live_subtitles.py packaging/hooks/hook-onnx_asr.py packaging/hooks/hook-sounddevice.py packaging/hooks/hook-torch.py
          python -c "[compile(open(path, encoding='utf-8').read(), path, 'exec') for path in ('packaging/console.spec', 'packaging/windowed.spec', 'packaging/combined.spec', 'packaging/combined_cpu.spec')]"
          python -c "import runpy; runpy.run_path('packaging/hooks/hook-onnx_asr.py'); runpy.run_path('packaging/hooks/hook-sounddevice.py')"
      - name: Parse PowerShell packaging scripts
        shell: pwsh
        run: |
          $errors = @(
            Get-ChildItem packaging -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$parseErrors
              ) | Out-Null
              $parseErrors
            }
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell parser reported $($errors.Count) error(s)."
          }
      - name: Run unit tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -v
